#!/bin/bash

###############################################################################
# GHL Onboarding Agent - Automated Deployment Script
# 
# This script automates the entire deployment process:
# 1. Validates environment variables
# 2. Runs Supabase migrations
# 3. Builds the Next.js application
# 4. Deploys to Vercel
# 5. Registers Inngest workflows
# 6. Runs post-deployment tests
#
# Usage:
#   ./deploy.sh [environment]
#
# Environments:
#   development - Deploy to development environment
#   staging     - Deploy to staging environment  
#   production  - Deploy to production environment (default)
#
# Prerequisites:
#   - Vercel CLI installed (npm i -g vercel)
#   - Supabase CLI installed (npm i -g supabase)
#   - Inngest CLI installed (npm i -g inngest-cli)
#   - Environment variables configured
###############################################################################

set -e  # Exit on error

# Colors for output
RED='\033[0;31m'
GREEN='\033[0;32m'
YELLOW='\033[1;33m'
BLUE='\033[0;34m'
NC='\033[0m' # No Color

# Default environment
ENVIRONMENT="${1:-production}"

# Log functions
log_info() {
    echo -e "${BLUE}ℹ${NC} $1"
}

log_success() {
    echo -e "${GREEN}✓${NC} $1"
}

log_warning() {
    echo -e "${YELLOW}⚠${NC} $1"
}

log_error() {
    echo -e "${RED}✗${NC} $1"
}

log_header() {
    echo ""
    echo -e "${BLUE}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${NC}"
    echo -e "${BLUE}$1${NC}"
    echo -e "${BLUE}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${NC}"
}

# Check if command exists
command_exists() {
    command -v "$1" >/dev/null 2>&1
}

# Validate prerequisites
check_prerequisites() {
    log_header "🔍 Checking Prerequisites"
    
    local missing_tools=()
    
    if ! command_exists node; then
        missing_tools+=("node")
    fi
    
    if ! command_exists npm; then
        missing_tools+=("npm")
    fi
    
    if ! command_exists vercel; then
        missing_tools+=("vercel")
    fi
    
    if ! command_exists supabase; then
        log_warning "Supabase CLI not found. Install with: npm i -g supabase"
        missing_tools+=("supabase")
    fi
    
    if ! command_exists git; then
        missing_tools+=("git")
    fi
    
    if [ ${#missing_tools[@]} -gt 0 ]; then
        log_error "Missing required tools: ${missing_tools[*]}"
        log_info "Install missing tools before continuing"
        exit 1
    fi
    
    log_success "All prerequisites installed"
}

# Validate environment variables
validate_env() {
    log_header "🔐 Validating Environment Variables"
    
    local required_vars=(
        "NEXT_PUBLIC_SUPABASE_URL"
        "NEXT_PUBLIC_SUPABASE_ANON_KEY"
        "SUPABASE_SERVICE_ROLE_KEY"
        "GHL_CLIENT_ID"
        "GHL_CLIENT_SECRET"
        "GHL_REDIRECT_URI"
        "NEXTAUTH_SECRET"
        "NEXTAUTH_URL"
    )
    
    local missing_vars=()
    
    for var in "${required_vars[@]}"; do
        if [ -z "${!var}" ]; then
            missing_vars+=("$var")
        fi
    done
    
    if [ ${#missing_vars[@]} -gt 0 ]; then
        log_error "Missing required environment variables:"
        for var in "${missing_vars[@]}"; do
            echo "  - $var"
        done
        log_info "Set these variables in .env.local or Vercel dashboard"
        exit 1
    fi
    
    log_success "All required environment variables present"
}

# Install dependencies
install_dependencies() {
    log_header "📦 Installing Dependencies"
    
    if [ ! -d "node_modules" ]; then
        log_info "Running npm install..."
        npm install
        log_success "Dependencies installed"
    else
        log_info "Checking for updates..."
        npm install
        log_success "Dependencies up to date"
    fi
}

# Run Supabase migrations
run_migrations() {
    log_header "🗄️  Running Database Migrations"
    
    if [ ! -d "supabase/migrations" ]; then
        log_warning "No migrations found, skipping..."
        return
    fi
    
    log_info "Applying migrations to Supabase..."
    
    # Check if supabase is linked
    if [ ! -f ".supabase/config.toml" ]; then
        log_warning "Supabase project not linked. Run: supabase link --project-ref [ref]"
        log_info "Skipping migrations..."
        return
    fi
    
    supabase db push || {
        log_error "Migration failed"
        exit 1
    }
    
    log_success "Migrations completed"
}

# Run tests
run_tests() {
    log_header "🧪 Running Tests"
    
    log_info "Running unit tests..."
    npm run test -- --passWithNoTests || {
        log_warning "Tests failed, but continuing..."
    }
    
    log_info "Running type checks..."
    npm run type-check || {
        log_warning "Type check failed, but continuing..."
    }
    
    log_success "Tests completed"
}

# Build application
build_app() {
    log_header "🏗️  Building Application"
    
    log_info "Running Next.js build..."
    npm run build || {
        log_error "Build failed"
        exit 1
    }
    
    log_success "Build completed"
}

# Deploy to Vercel
deploy_vercel() {
    log_header "🚀 Deploying to Vercel"
    
    local deploy_flags=""
    
    if [ "$ENVIRONMENT" == "production" ]; then
        deploy_flags="--prod"
        log_info "Deploying to PRODUCTION..."
    else
        log_info "Deploying to $ENVIRONMENT..."
    fi
    
    # Deploy
    vercel $deploy_flags || {
        log_error "Deployment failed"
        exit 1
    }
    
    log_success "Deployed to Vercel"
}

# Register Inngest workflows
register_inngest() {
    log_header "⚡ Registering Inngest Workflows"
    
    if [ -z "$INNGEST_EVENT_KEY" ]; then
        log_warning "INNGEST_EVENT_KEY not set, skipping workflow registration"
        return
    fi
    
    log_info "Syncing Inngest functions..."
    
    # Get deployment URL
    local deployment_url=$(vercel inspect --json | jq -r '.url')
    
    if [ -z "$deployment_url" ]; then
        log_warning "Could not get deployment URL, skipping Inngest sync"
        return
    fi
    
    log_info "Triggering Inngest sync at https://${deployment_url}/api/inngest"
    
    curl -X PUT "https://${deployment_url}/api/inngest" \
        -H "Content-Type: application/json" || {
        log_warning "Inngest sync failed, but continuing..."
    }
    
    log_success "Inngest workflows registered"
}

# Run post-deployment tests
post_deployment_tests() {
    log_header "🔬 Running Post-Deployment Tests"
    
    # Get deployment URL
    local deployment_url=$(vercel inspect --json | jq -r '.url')
    
    if [ -z "$deployment_url" ]; then
        log_warning "Could not get deployment URL for testing"
        return
    fi
    
    log_info "Testing deployment at https://${deployment_url}"
    
    # Test health endpoint
    log_info "Testing health endpoint..."
    local health_status=$(curl -s -o /dev/null -w "%{http_code}" "https://${deployment_url}/api/health")
    
    if [ "$health_status" == "200" ]; then
        log_success "Health check passed"
    else
        log_warning "Health check returned status: $health_status"
    fi
    
    # Test API endpoints
    log_info "Testing API accessibility..."
    local api_status=$(curl -s -o /dev/null -w "%{http_code}" "https://${deployment_url}/api")
    
    if [ "$api_status" == "404" ] || [ "$api_status" == "200" ]; then
        log_success "API routes accessible"
    else
        log_warning "API returned status: $api_status"
    fi
    
    log_success "Post-deployment tests completed"
}

# Generate deployment report
generate_report() {
    log_header "📊 Deployment Summary"
    
    local deployment_url=$(vercel inspect --json 2>/dev/null | jq -r '.url' 2>/dev/null || echo "unknown")
    
    echo ""
    echo "┌────────────────────────────────────────────────────────────┐"
    echo "│  DEPLOYMENT SUCCESSFUL ✓                                   │"
    echo "├────────────────────────────────────────────────────────────┤"
    echo "│  Environment:    $ENVIRONMENT"
    echo "│  URL:            https://${deployment_url}"
    echo "│  Date:           $(date '+%Y-%m-%d %H:%M:%S')"
    echo "├────────────────────────────────────────────────────────────┤"
    echo "│  Next Steps:                                               │"
    echo "│  1. Visit deployment URL to verify                        │"
    echo "│  2. Test OAuth flow with GHL                              │"
    echo "│  3. Submit test form                                      │"
    echo "│  4. Monitor Inngest dashboard for workflow execution      │"
    echo "│  5. Check logs: vercel logs                               │"
    echo "└────────────────────────────────────────────────────────────┘"
    echo ""
}

# Cleanup function
cleanup() {
    log_info "Cleaning up..."
}

# Rollback function
rollback() {
    log_error "Deployment failed. Initiating rollback..."
    
    log_info "Rolling back to previous Vercel deployment..."
    vercel rollback || {
        log_error "Rollback failed. Manual intervention required."
        exit 1
    }
    
    log_success "Rollback completed"
    exit 1
}

# Main deployment flow
main() {
    log_header "🚀 GHL Onboarding Agent Deployment"
    log_info "Environment: $ENVIRONMENT"
    log_info "Started at: $(date '+%Y-%m-%d %H:%M:%S')"
    
    # Set up error handling
    trap rollback ERR
    trap cleanup EXIT
    
    # Run deployment steps
    check_prerequisites
    validate_env
    install_dependencies
    run_migrations
    run_tests
    build_app
    deploy_vercel
    register_inngest
    post_deployment_tests
    generate_report
    
    log_success "Deployment completed successfully! 🎉"
}

# Run main function
main
